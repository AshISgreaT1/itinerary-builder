<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Itinerary Planner</title>
<style>
  :root {
    --bg: #f7f8fa; --panel: #ffffff; --ink: #11161d; --muted: #667085; --line: #e6e9ee;
    --line-soft: #f0f2f5;
    --brand: #1a5fd0; --brand-soft: #eef4ff; --brand-ink: #0b3d91; --accent: #0f766e;
    --ok: #15803d; --ok-bg: #edf8f1; --warn: #92510a; --warn-bg: #fdf4e6; --bad: #b42318; --bad-bg: #fdeeec;
    --sight: #1a5fd0; --buffer: #b6bcc7; --travel: #d97706; --free: #eceff3;
    --radius: 12px; --radius-lg: 16px;
    --shadow: 0 1px 2px rgba(16,24,40,.05);
    --shadow-lift: 0 1px 2px rgba(16,24,40,.05), 0 12px 28px -12px rgba(16,24,40,.18);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1116; --panel: #151a21; --ink: #e7eaee; --muted: #98a2b3; --line: #242b35;
      --line-soft: #1c222b;
      --brand: #6ba3ff; --brand-soft: #16233a; --brand-ink: #cfe0ff; --ok: #6ee7a8; --ok-bg: #11291e;
      --warn: #fbbf24; --warn-bg: #281f10; --bad: #fca5a5; --bad-bg: #2a1515;
      --free: #242b35; --buffer: #4b5563; --travel: #f0a24a;
      --shadow: 0 1px 2px rgba(0,0,0,.45);
      --shadow-lift: 0 1px 2px rgba(0,0,0,.45), 0 12px 28px -12px rgba(0,0,0,.6);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.6 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px 72px; }
  /* A slim masthead rather than a tall gradient: the trip is the subject of this page,
     not the product name. */
  header.hero {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    padding: 22px 0 18px; margin-bottom: 20px; border-bottom: 1px solid var(--line);
    background: none; color: inherit; border-radius: 0; box-shadow: none;
  }
  header.hero h1 { margin: 0; font-size: 19px; font-weight: 650; letter-spacing: -.015em; }
  header.hero h1::before {
    content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 9px;
    border-radius: 3px; background: var(--brand); vertical-align: middle;
  }
  header.hero p { margin: 0; color: var(--muted); font-size: 13.5px; }

  form.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-lg);
    box-shadow: var(--shadow); padding: 20px; margin: 0; position: relative; z-index: 2; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  label { display: block; font-size: 11.5px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .05em; color: var(--muted); margin-bottom: 6px; }
  input, select { width: 100%; height: 40px; padding: 0 11px; border: 1px solid var(--line);
    border-radius: 9px; background: var(--panel); color: var(--ink); font: inherit;
    transition: border-color .12s ease, box-shadow .12s ease; }
  select { padding-right: 6px; }
  input:hover, select:hover { border-color: #cfd5de; }
  input:focus, select:focus { outline: none; border-color: var(--brand);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 18%, transparent); }
  /* One visible focus style for everything reachable by keyboard. */
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { border: 1px solid var(--line); background: var(--panel); color: var(--muted);
    border-radius: 999px; padding: 5px 12px; font-size: 12.5px; cursor: pointer;
    transition: background .12s ease, border-color .12s ease, color .12s ease; }
  .chip:hover { border-color: var(--brand); color: var(--brand); background: var(--brand-soft); }
  .chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #fff; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 16px; }
  button.primary { background: var(--brand); color: #fff; border: 0; border-radius: 9px;
    height: 40px; padding: 0 20px; font: inherit; font-weight: 600; cursor: pointer;
    transition: background .12s ease, transform .06s ease; }
  button.primary:hover { background: #164fae; }
  button.primary:active { transform: translateY(1px); }
  button.primary:disabled { opacity: .55; cursor: progress; }
  button.ghost { background: var(--panel); border: 1px solid var(--line); color: var(--ink);
    border-radius: 9px; height: 40px; padding: 0 16px; font: inherit; cursor: pointer;
    transition: border-color .12s ease, background .12s ease; }
  button.ghost:hover { border-color: #cfd5de; background: var(--line-soft); }
  .mini { border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    border-radius: 8px; padding: 5px 11px; font: inherit; font-size: 12.5px; cursor: pointer;
    transition: border-color .12s ease, background .12s ease, color .12s ease; }
  .mini:hover { border-color: var(--brand); color: var(--brand); background: var(--brand-soft); }
  .mini:disabled { opacity: .45; cursor: default; }
  .mini:disabled:hover { border-color: var(--line); color: var(--ink); background: var(--panel); }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); gap: 10px;
    margin: 4px 0 18px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px 16px; }
  .stat b { display: block; font-size: 22px; font-weight: 650; letter-spacing: -.02em;
    font-variant-numeric: tabular-nums; }
  .stat span { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }

  .banner { margin-top: 18px; border-radius: var(--radius); padding: 14px 16px; border: 1px solid transparent; }
  .banner h3 { margin: 0 0 6px; font-size: 15px; }
  .banner.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
  .banner.bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
  .banner ul { margin: 8px 0 0; padding-left: 18px; color: var(--ink); }
  .banner li { margin-bottom: 6px; }
  .fix { color: var(--muted); font-size: 13px; }
  details.sub { margin-top: 10px; }
  details.sub summary { cursor: pointer; font-size: 13px; color: var(--muted); }

  .route { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .leg { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent);
    border-radius: 10px; padding: 8px 12px; font-size: 13px; }
  .leg.gap { border-left-color: var(--bad); }
  .leg b { font-weight: 650; }

  .day { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); margin-top: 14px; overflow: hidden; position: relative; }
  /* A rail rather than a heavier border: it marks where a day starts at a glance. */
  .day::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--brand); opacity: .85; }
  .day.tips::before, .day.missed::before { background: var(--muted); }
  .day > header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
    padding: 15px 18px 13px; border-bottom: 1px solid var(--line-soft); flex-wrap: wrap; }
  .day h2 { margin: 0; font-size: 16.5px; font-weight: 650; letter-spacing: -.01em; }
  .day .where { color: var(--muted); font-size: 13px; }
  .bar { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--free); margin: 0 18px; }
  .bar i { display: block; height: 100%; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; padding: 8px 18px 0; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; }
  ol.sights { list-style: none; margin: 10px 0 0; padding: 0 18px 16px; }
  ol.sights li { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  ol.sights li:first-child { border-top: 0; }
  .num { flex: 0 0 26px; height: 26px; border-radius: 50%; background: var(--bg); border: 1px solid var(--line);
    display: grid; place-items: center; font-size: 12px; color: var(--muted); font-weight: 650; }
  .sight-name { font-weight: 620; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--bg);
    border: 1px solid var(--line); color: var(--muted); }
  .tag.must { color: var(--brand-ink); border-color: var(--brand); }
  .tag.trip { color: var(--warn); border-color: var(--warn); }
  .tag.road { color: var(--accent); border-color: var(--accent); }
  ol.sights li.en-route { background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 7%, transparent), transparent); }
  .desc { color: var(--muted); font-size: 13.5px; margin-top: 6px; }
  .notes { margin: 0; padding: 10px 18px 14px; color: var(--muted); font-size: 13px; }
  .tl-note { margin: 6px 0 0; font-size: 12.5px; color: var(--muted); }
  .tips .tip { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center;
               padding: 10px 12px; margin: 8px 18px; border-radius: 10px; border: 1px solid var(--line); }
  .tip-what { font-size: 13px; }
  .tip-fix { grid-column: 1; font-size: 12.5px; color: var(--muted); }
  .tip .apply { grid-row: 1 / span 2; grid-column: 2; }
  .tip-conflict { background: rgba(37, 99, 235, 0.06); border-color: rgba(37, 99, 235, 0.25); }
  .tip-capacity, .tip-balance { background: rgba(16, 185, 129, 0.06); border-color: rgba(16, 185, 129, 0.25); }
  .day-controls { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 18px 10px; }
  form.card.tucked { display: none; }
  .trip-bar { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px;
              flex-wrap: wrap; margin: 22px 0 14px; }
  .trip-bar h2 { margin: 0 0 2px; font-size: 26px; font-weight: 680; letter-spacing: -.025em; }
  .trip-bar .where { color: var(--muted); font-size: 13px; }
  .trip-bar-actions { display: flex; gap: 8px; }
  .mini.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 18px 0 20px;
          flex-wrap: wrap; position: sticky; top: 0; z-index: 5; background: var(--bg);
          padding-top: 4px; }
  .tab { appearance: none; background: none; border: none; border-bottom: 2px solid transparent;
         padding: 10px 15px; font: inherit; font-size: 14px; color: var(--muted); cursor: pointer;
         margin-bottom: -1px; border-radius: 8px 8px 0 0;
         transition: color .12s ease, background .12s ease; }
  .tab:hover { color: var(--ink); background: var(--line-soft); }
  .tab.on { color: var(--brand); border-bottom-color: var(--brand); font-weight: 600;
            background: none; }
  .tab-count { display: inline-block; min-width: 19px; padding: 0 6px; margin-left: 7px;
               border-radius: 9px; background: var(--brand-soft); color: var(--brand);
               font-size: 11px; font-weight: 600; line-height: 19px; text-align: center; }
  .tab.on .tab-count { background: var(--brand); color: #fff; }
  .panel { display: none; }
  .panel.on { display: block; }
  .panel-hint { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
  .who { display: grid; grid-template-columns: 220px 1fr; gap: 14px; margin-top: 14px;
         align-items: start; }
  .who .hint { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--muted); }
  .interests-field .chips { margin-top: 0; }
  .explore { margin: 10px 18px 16px; padding: 12px 14px; border: 1px dashed var(--line);
             border-radius: var(--radius); background: var(--line-soft); }
  .explore-head { font-size: 12px; font-weight: 650; text-transform: uppercase;
                  letter-spacing: .05em; color: var(--muted); margin-bottom: 8px; }
  .explore-note { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .free-pill { display: inline-block; margin: 0 6px 8px 0; padding: 3px 9px; border-radius: 999px;
               background: var(--panel); border: 1px solid var(--line); font-size: 12px;
               color: var(--muted); }
  .explore-list { display: flex; flex-direction: column; gap: 8px; }
  .explore-item { display: flex; justify-content: space-between; align-items: center; gap: 12px;
                  padding: 9px 11px; background: var(--panel); border: 1px solid var(--line);
                  border-radius: 10px; }
  .explore-why { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .explore-cost { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .view-day .v-row { display: grid; grid-template-columns: 112px 1fr; gap: 14px;
                     padding: 11px 18px; border-top: 1px solid var(--line-soft); }
  .view-day .v-row:first-of-type { border-top: none; }
  .view-day .v-row:hover { background: var(--line-soft); }
  .v-time { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums;
            white-space: nowrap; padding-top: 1px; }
  .v-what b { font-size: 14.5px; font-weight: 600; }
  .v-note { color: var(--muted); font-size: 13px; margin-top: 3px; line-height: 1.5;
            max-width: 72ch; }
  .trip-panel .alloc { margin: 0 18px 14px; }
  .alloc-head { display: flex; justify-content: space-between; font-size: 12px; letter-spacing: .04em;
                text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .alloc-row { display: grid; grid-template-columns: 1fr auto auto auto; gap: 10px;
               align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
  .alloc-city { font-weight: 600; }
  .alloc-n { min-width: 22px; text-align: center; font-variant-numeric: tabular-nums; }
  .alloc-nights, .alloc-note { color: var(--muted); font-size: 12.5px; }
  .pace-row { display: flex; gap: 8px; }
  .mini.on { background: var(--brand); color: #fff; border-color: var(--brand); }
  .exchange { margin: 6px 18px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; }
  .exchange button { margin: 3px 4px 0 0; }
  .activity-panel { flex-basis: 100%; margin-top: 8px; padding: 10px; border: 1px solid var(--line);
                    border-radius: 10px; background: var(--panel); }
  .act-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .act-row input[type="text"] { flex: 1; min-width: 180px; padding: 7px 10px; border: 1px solid var(--line);
                                border-radius: 8px; font: inherit; }
  .act-row label { font-size: 12.5px; color: var(--muted); display: flex; gap: 4px; align-items: center; }
  .act-row input[type="number"], .act-row input[size="6"] { padding: 6px 8px; border: 1px solid var(--line);
                                border-radius: 8px; font: inherit; width: 72px; }
  .act-matches { display: flex; flex-direction: column; gap: 4px; margin: 8px 0; max-height: 240px;
                 overflow: auto; }
  .act-match { text-align: left; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px;
               background: #fff; cursor: pointer; font: inherit; display: flex; gap: 8px;
               align-items: baseline; flex-wrap: wrap; }
  .act-match:hover { border-color: var(--accent); background: rgba(37, 99, 235, 0.04); }
  .act-why { color: var(--muted); font-size: 12px; }
  .act-how { font-size: 11px; color: var(--accent); text-transform: uppercase; letter-spacing: .04em; }
  .sights li[draggable="true"] { cursor: grab; }
  .sights li.dragging { opacity: 0.45; }
  .sights li.drop-target { outline: 2px dashed var(--accent); outline-offset: 2px; border-radius: 8px; }
  section.day.drop-target { outline: 2px dashed var(--accent); outline-offset: 4px; }
  .legend.outside { color: var(--muted); font-size: 12px; margin-top: -2px; }
  .tl-alt { margin: 6px 0 0; padding: 7px 10px; border-radius: 8px; font-size: 12.5px;
            background: rgba(37, 99, 235, 0.08); color: #1d4ed8; border: 1px solid rgba(37, 99, 235, 0.25); }
  .timeline { margin: 4px 18px 10px; border-top: 1px solid var(--line); padding-top: 10px; }
  .timeline summary { cursor: pointer; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .tl-row { display: grid; grid-template-columns: 96px 12px 1fr; gap: 10px; align-items: baseline;
    padding: 4px 0; font-size: 13.5px; }
  .tl-time { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12.5px; }
  .tl-dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 5px; background: var(--muted); }
  .tl-sight .tl-dot { background: var(--sight); }
  .tl-travel .tl-dot, .tl-transfer .tl-dot { background: var(--travel); }
  .tl-lunch .tl-dot, .tl-break .tl-dot { background: var(--accent); }
  .tl-free .tl-dot, .tl-wait .tl-dot { background: var(--line); }
  .tl-label b { font-weight: 620; }
  .tl-detail { color: var(--muted); font-size: 12.5px; }
  .tl-flag { color: var(--warn); font-size: 12.5px; margin-top: 6px; }
  .notes li { margin-bottom: 3px; }
  .empty { padding: 14px 18px 18px; color: var(--muted); font-size: 14px; }
  .missed { margin-top: 18px; background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 14px 18px; }
  .missed h3 { margin: 0 0 8px; font-size: 15px; }
  .missed li { margin-bottom: 6px; font-size: 13.5px; }
  .err { color: var(--bad); margin-top: 16px; }
  .sight-actions { margin-left: auto; display: flex; gap: 6px; align-items: flex-start; }

  .add-panel { margin-top: 18px; background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; }
  .add-panel h3 { margin: 0 0 4px; font-size: 16px; }
  .add-panel .sub { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .addable { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .addable .grow { flex: 1 1 260px; }
  .addable .why { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
  .daypick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; flex-basis: 100%; }
  .daypick button { font-size: 12px; padding: 5px 10px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .daypick button.fit { border-color: var(--ok); color: var(--ok); }
  .daypick button.swap { border-color: var(--warn); color: var(--warn); }
  .daypick button.no { opacity: .55; cursor: not-allowed; }
  .changes { margin-top: 16px; border-radius: var(--radius); padding: 12px 16px; background: var(--panel);
    border: 1px solid var(--line); }
  .changes li { margin-bottom: 6px; font-size: 13.5px; }
  .changes .no { color: var(--bad); }
  .changes .yes { color: var(--ok); }
  footer { margin-top: 28px; color: var(--muted); font-size: 12px; text-align: center; }
  /* The screen app and the printed itinerary are two different documents. Printing shows
     only the second, so nothing on screen -- controls, budgets, validation, suggestions --
     has to be hidden rule by rule and nothing new leaks into the page by being added. */
  #print-doc { display: none; }
  @media print {
    @page { size: A4; margin: 14mm 13mm 16mm; }
    .wrap > *:not(#print-doc), .hero, form.card { display: none !important; }
    html, body { background: #fff; margin: 0; padding: 0; font-size: 10.5pt; color: #111; }
    #print-doc { display: block; }
  }
  #print-doc { font-family: "Segoe UI", system-ui, sans-serif; color: #111; }
  .pr-head { border-bottom: 2px solid #111; padding-bottom: 8px; margin-bottom: 14px; }
  .pr-title { font-size: 20pt; font-weight: 700; margin: 0 0 2px; letter-spacing: -0.01em; }
  .pr-sub { font-size: 10pt; color: #444; }
  .pr-day { break-inside: avoid; page-break-inside: avoid; margin: 0 0 14px; }
  .pr-day-head { display: flex; justify-content: space-between; align-items: baseline;
                 background: #f2f4f7; border-left: 3px solid #111; padding: 5px 9px; margin-bottom: 6px; }
  .pr-day-no { font-weight: 700; font-size: 11pt; }
  .pr-day-where { font-size: 9.5pt; color: #444; }
  .pr-transfer { font-size: 9.5pt; padding: 4px 9px; background: #fafafa; border-left: 3px solid #bbb;
                 margin-bottom: 6px; }
  table.pr-items { width: 100%; border-collapse: collapse; }
  table.pr-items td { vertical-align: top; padding: 4px 9px 5px 0; border-bottom: 1px solid #eee; }
  td.pr-time { width: 86px; white-space: nowrap; font-variant-numeric: tabular-nums; color: #333; }
  td.pr-what b { font-size: 10.5pt; }
  .pr-note { color: #555; font-size: 9pt; display: block; margin-top: 1px; }
  .pr-terms { break-inside: avoid; page-break-inside: avoid; margin-top: 16px;
              border-top: 1px solid #ccc; padding-top: 10px; }
  .pr-terms h3 { font-size: 10.5pt; margin: 0 0 4px; }
  .pr-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .pr-terms ul { margin: 0; padding-left: 16px; }
  .pr-terms li { font-size: 9.5pt; margin-bottom: 2px; }
  .pr-foot { margin-top: 12px; border-top: 1px solid #ccc; padding-top: 6px;
             font-size: 8.5pt; color: #666; }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1>Itinerary Planner</h1>
    <p>Day-by-day sight sequences built from the dataset — time-bounded, spatially clustered, feasibility-checked.</p>
  </header>

  <form class="card" id="form">
    <div class="grid">
      <div>
        <label for="city-search">Cities (in travel order)</label>
        <input id="city-search" type="search" placeholder="Search cities…" autocomplete="off" />
      </div>
      <div>
        <label for="days">Days</label>
        <input id="days" type="number" min="1" max="30" value="4" />
      </div>
      <div>
        <label for="pace">Pace</label>
        <select id="pace">
          <option value="relaxed">Relaxed — 5h/day</option>
          <option value="moderate" selected>Moderate — 7h/day</option>
          <option value="active">Active — 9h/day</option>
        </select>
      </div>
      <div>
        <label for="origin">Travelling from (optional)</label>
        <select id="origin"><option value="">— already there —</option></select>
      </div>
      <div>
        <label for="month">Travel month</label>
        <select id="month"><option value="">— any —</option></select>
      </div>
    </div>
    <div class="chips" id="selected" aria-label="Selected cities"></div>
    <div class="chips" id="suggestions"></div>
    <div class="who">
      <div>
        <label for="group">Who is travelling</label>
        <select id="group">
          <option value="">— not said —</option>
          <option value="solo">Solo</option>
          <option value="couple">Couple</option>
          <option value="friends">Friends</option>
          <option value="family">Family</option>
        </select>
      </div>
      <div class="interests-field">
        <label>Interests <span class="hint">pick any — used to choose between equally good sights</span></label>
        <div class="chips" id="interests">
          ${""}
        </div>
      </div>
    </div>
    <div class="row">
      <button class="primary" id="go" type="submit">Generate itinerary</button>
      <button class="ghost" id="print" type="button">Print</button>
      <span class="fix" id="status"></span>
    </div>
  </form>

  <div id="out"></div>
  <div id="print-doc"></div>
  <footer>Deterministic engine · no pricing, flights or hotel selection · distances from the dataset's coordinates</footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
let cities = [], chosen = [], lastRequest = null, lastPlan = null, edits = [];
// Customisations are kept on the request, not patched into the plan: every change is a
// rebuild, which is the only way the route, the clock and the validator stay in step.
let customisations = [];

const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const hours = (value) => `${(Math.round(value * 10) / 10).toFixed(1)}h`;
// "Pangong Lake / Pangong Lake" is a city whose main sight carries the same name: show it once.
const prettyLabel = (label) => {
  const [city, ...rest] = String(label).split(" / ");
  const name = rest.join(" / ");
  return !name || name.toLowerCase() === city.toLowerCase() ? city : `${city} / ${name}`;
};

async function loadCities() {
  // Destinations must have sightseeing rows; an origin only needs to exist (e.g. Delhi).
  fetch("/preferences/options").then((r) => r.json()).then(renderInterests).catch(() => {});
  const [withSights, everyCity] = await Promise.all([
    fetch("/cities").then((r) => r.json()),
    fetch("/cities?with_sights_only=false").then((r) => r.json()),
  ]);
  cities = withSights.cities;
  $("origin").insertAdjacentHTML("beforeend",
    everyCity.cities.map((c) => `<option value="${esc(c.city)}">${esc(c.city)}${c.sights ? "" : " (no sights)"}</option>`).join(""));
  MONTHS.forEach((name, index) =>
    $("month").insertAdjacentHTML("beforeend", `<option value="${index + 1}">${name}</option>`));
  renderSuggestions("");
}

function renderSuggestions(query) {
  const needle = query.trim().toLowerCase();
  const matches = cities
    .filter((c) => !chosen.includes(c.city) && (!needle || c.city.toLowerCase().includes(needle)))
    .slice(0, needle ? 8 : 6);
  $("suggestions").innerHTML = matches
    .map((c) => `<button type="button" class="chip" data-add="${esc(c.city)}">+ ${esc(c.city)} <span style="opacity:.6">${c.sights}</span></button>`)
    .join("");
}

function renderChosen() {
  $("selected").innerHTML = chosen
    .map((city, index) => `<button type="button" class="chip" aria-pressed="true" data-remove="${esc(city)}">${index + 1}. ${esc(city)} ✕</button>`)
    .join("");
}

document.addEventListener("click", (event) => {
  const add = event.target.closest("[data-add]"), remove = event.target.closest("[data-remove]");
  if (add) { chosen.push(add.dataset.add); renderChosen(); renderSuggestions($("city-search").value); }
  if (remove) { chosen = chosen.filter((c) => c !== remove.dataset.remove); renderChosen(); renderSuggestions($("city-search").value); }
});
$("city-search").addEventListener("input", (event) => renderSuggestions(event.target.value));
$("print").addEventListener("click", () => {
  if (!lastPlan) { $("status").textContent = "Generate an itinerary first."; return; }
  renderPrint(lastPlan);
  window.print();
});

$("form").addEventListener("submit", async (event) => {
  event.preventDefault();
  if (!chosen.length) { $("status").textContent = "Pick at least one city."; return; }
  $("go").disabled = true; $("status").textContent = "Planning…";
  const body = {
    cities: chosen,
    duration_days: Number($("days").value),
    pace: $("pace").value,
    origin_city: $("origin").value || null,
    start_month: $("month").value ? Number($("month").value) : null,
    group_type: $("group").value || null,
    interests: chosenInterests,
  };
  lastRequest = body; edits = [];
  try {
    customisations = [];
    edits = [];
    const response = await fetch("/generate-itinerary", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    });
    const payload = await response.json();
    if (!response.ok) {
      $("out").innerHTML = `<p class="err">${esc(payload.detail || "Could not plan this trip.")}</p>`;
    } else {
      // /generate-itinerary does not compute suggestions; ask for them so a fresh plan
      // arrives with the same advice a customised one carries.
      closeForm();
      payload.suggestions = await fetch("/itinerary/suggestions", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ base: body }),
      }).then((r) => (r.ok ? r.json() : null)).catch(() => null);
      render(payload);
    }
  } catch (error) {
    $("out").innerHTML = `<p class="err">${esc(error.message)}</p>`;
  } finally {
    $("go").disabled = false; $("status").textContent = "";
  }
});

function validationBanner(validation) {
  const criticals = validation.entries.filter((e) => e.severity === "critical");
  const warnings = validation.entries.filter((e) => e.severity === "warning");
  const notes = validation.notes || [];
  const head = validation.passed
    ? `<div class="banner ok"><h3>✓ Feasible — every critical check passed</h3>`
    : `<div class="banner bad"><h3>✕ Not feasible — ${criticals.length} blocking issue${criticals.length > 1 ? "s" : ""}</h3>`;
  const list = criticals.length
    ? `<ul>${criticals.map((e) => {
        const prefix = (e.day && !/^Day\s/i.test(e.message)) ? `<b>Day ${e.day}:</b> ` : "";
        return `<li>${prefix}${esc(e.message)}<div class="fix">Fix: ${esc(e.fix)}</div></li>`;
      }).join("")}</ul>`
    : "";
  const extra = (warnings.length || notes.length)
    ? `<details class="sub"><summary>${warnings.length} warning(s), ${notes.length} note(s)</summary><ul>` +
      warnings.map((e) => `<li>⚠ ${esc(e.message)}${e.fix ? `<div class="fix">${esc(e.fix)}</div>` : ""}</li>`).join("") +
      notes.map((n) => `<li>· ${esc(n)}</li>`).join("") + `</ul></details>`
    : "";
  return head + list + extra + `</div>`;
}

// The plan as a customer reads it: when, what, and a line about why it is worth seeing.
function dayView(day) {
  const schedule = day.schedule || {};
  const blocks = (schedule.blocks || []).filter((b) =>
    ["sight", "transfer", "custom", "lunch", "check-in", "checkout"].includes(b.kind));
  const stops = day.sights.filter((s) => !s.en_route).length;

  const where = day.transfer
    ? `${esc(day.transfer.from_city)} → ${esc(day.transfer.to_city)}${
        day.transfer.drive_hours !== null
          ? ` · ${hours(day.transfer.drive_hours)} by ${esc(day.transfer.mode)}`
          : " · journey time missing"}`
    : (day.is_arrival_day ? "Arrival day" : day.is_departure_day ? "Departure day" : "");

  const rows = blocks.map((block) => {
    const sight = day.sights.find((s) => s.sight === block.sight);
    const note = block.kind === "sight" ? (sight?.description || "") : (block.detail || "");
    return `<div class="v-row">
        <div class="v-time">${esc(block.start)}–${esc(block.end)}</div>
        <div class="v-what">
          <b>${esc(block.kind === "sight" ? block.sight : block.label)}</b>
          ${sight?.must_visit ? '<span class="tag must">★ must visit</span>' : ""}
          ${sight?.is_excursion ? `<span class="tag trip">day trip · ${sight.distance_from_centre_km} km</span>` : ""}
          ${note ? `<div class="v-note">${esc(note)}</div>` : ""}
        </div>
      </div>`;
  }).join("");

  return `<section class="day view-day">
      <header>
        <div><h2>Day ${day.day} · ${esc(day.city)}</h2>${
          where ? `<div class="where">${where}</div>` : ""}</div>
        <div class="where">${schedule.starts ? `${esc(schedule.starts)}–${esc(schedule.ends)}` : ""}${
          stops ? ` · ${stops} stop${stops === 1 ? "" : "s"}` : ""}</div>
      </header>
      ${rows || `<p class="empty">${esc((day.notes || [])[0] || "A free day.")}</p>`}
      ${exploreBlock(day)}
    </section>`;
}

// Optional activities sit visibly apart from the plan: the customer has not chosen them,
// they are not scheduled, and nothing about the day's hours counts them.
function exploreBlock(day) {
  const options = day.explore_on_your_own || [];
  const windows = day.free_windows || [];
  if (!options.length && !windows.length) return "";
  const free = windows.map((w) =>
    `<span class="free-pill">${esc(w.starts)}–${esc(w.ends)} · ${hours(w.hours)} free</span>`).join("");
  if (!options.length) {
    return `<div class="explore"><div class="explore-head">Free time</div>${free}</div>`;
  }
  return `<div class="explore">
      <div class="explore-head">Explore on your own <span class="explore-note">optional · not in the
        itinerary or its price unless you add it</span></div>
      ${free}
      <div class="explore-list">${options.map((o) => `
        <div class="explore-item">
          <div>
            <b>${esc(o.sight)}</b>
            <span class="tag">${esc(o.category || o.visit_type)}</span>
            <div class="explore-why">${esc(o.why || "near your free time that day")}</div>
            <div class="explore-cost">${hours(o.duration_hours)} there, ${hours(o.travel_hours)} travel
              · fits your ${hours(o.window_hours)} window · ${esc(o.price_note)}</div>
          </div>
          <button class="mini" data-take="${esc(o.sight)}" data-take-day="${day.day}"
            data-city="${esc(o.city)}">Add to itinerary</button>
        </div>`).join("")}</div>
    </div>`;
}

// A day is drawn twice: once as the customer will read it, once with everything an agent
// can change. Keeping both in one function means the two views cannot drift apart.
function dayCard(day, mode) {
  if (mode !== "edit") return dayView(day);
  const budget = day.time_budget || {};
  const schedule = day.schedule || {};
  const totals = schedule.totals || {};
  const allowance = Math.max(budget.pace_allowance || 0, day.used_hours + (budget.intercity_travel_hours || 0));
  const part = (value) => `${Math.max(0, (value / (allowance || 1)) * 100)}%`;
  const travel = (budget.intercity_travel_hours || 0) + (budget.day_overhead_hours || 0);
  const bar = `<div class="bar">
      <i style="width:${part(day.sightseeing_hours)};background:var(--sight)"></i>
      <i style="width:${part(day.buffer_hours)};background:var(--buffer)"></i>
      <i style="width:${part(day.local_travel_hours + travel)};background:var(--travel)"></i>
    </div>
    <div class="legend">
      <span><i style="background:var(--sight)"></i>sightseeing ${hours(day.sightseeing_hours)}</span>
      <span><i style="background:var(--buffer)"></i>stop buffers ${hours(day.buffer_hours)}</span>
      <span><i style="background:var(--travel)"></i>travel &amp; overheads ${hours(day.local_travel_hours + travel)}</span>
      <span><i style="background:var(--free)"></i>free ${hours(Math.max(0, day.available_hours - day.used_hours))}</span>
    </div>
    ${totals.meals_and_breaks || totals.waiting || totals.check_in_out ? `<div class="legend outside">
      <span>on top of the sightseeing budget:</span>
      ${totals.meals_and_breaks ? `<span>meals &amp; breaks ${hours(totals.meals_and_breaks)}</span>` : ""}
      ${totals.waiting ? `<span>waiting for a slot ${hours(totals.waiting)}</span>` : ""}
      ${totals.check_in_out ? `<span>check-in / out ${hours(totals.check_in_out)}</span>` : ""}
    </div>` : ""}`;

  const sights = day.sights.length
    ? `<ol class="sights">${day.sights.map((sight, index) => `
        <li class="${sight.en_route ? "en-route" : ""}" draggable="${!sight.en_route}"
            data-sight="${esc(sight.sight)}" data-from-day="${day.day}" data-index="${index}">
          <div class="num" title="drag to move">${sight.en_route ? "&#9655;" : index + 1}</div>
          <div>
            <div class="sight-name">${esc(sight.sight)}</div>
            <div class="tags">
              <span class="tag">${hours(sight.duration_hours)}</span>
              <span class="tag">${esc(sight.best_time)}</span>
              ${sight.visit_type ? `<span class="tag">${esc(sight.visit_type)}</span>` : ""}
              ${sight.must_visit ? `<span class="tag must">★ must visit</span>` : ""}
              ${sight.is_excursion ? `<span class="tag trip">day trip · ${sight.distance_from_centre_km} km</span>` : ""}
              ${sight.en_route ? `<span class="tag road">on the way · ${sight.detour_km} km off the road</span>` : ""}
            </div>
            ${sight.description ? `<div class="desc">${esc(sight.description)}</div>` : ""}
          </div>
          <div class="sight-actions">
            <button class="mini" data-exchange="${esc(sight.sight)}" data-day="${day.day}"
              title="swap with a stop on another day">Swap</button>
            <button class="mini" data-swap="${esc(sight.sight)}" data-city="${esc(day.city)}" data-day="${day.day}">Replace</button>
            <button class="mini" data-drop="${esc(sight.sight)}" data-city="${esc(day.city)}">Remove</button>
          </div>
        </li>`).join("")}</ol>`
    : `<p class="empty">No sightseeing on this day — ${esc((day.notes || [])[0] || "the day is taken by travel.")}</p>`;

  // The heading already names the city; repeating it below says nothing twice.
  const where = day.transfer
    ? `${esc(day.transfer.from_city)} → ${esc(day.transfer.to_city)}${day.transfer.drive_hours !== null ? ` · ${hours(day.transfer.drive_hours)} by ${esc(day.transfer.mode)}` : " · journey time missing"}`
    : (day.is_arrival_day ? "Arrival day" : day.is_departure_day ? "Departure day" : "");

  const timeline = (schedule.blocks || []).length
    ? `<details class="timeline" open>
        <summary>Timed plan · ${esc(schedule.starts)} to ${esc(schedule.ends)}</summary>
        ${schedule.blocks.map((block) => `
          <div class="tl-row tl-${esc(block.kind)}">
            <span class="tl-time">${esc(block.start)} – ${esc(block.end)}</span>
            <span class="tl-dot"></span>
            <span class="tl-label">${block.kind === "sight" ? `<b>${esc(block.label)}</b>` : esc(block.label)}
              ${block.detail ? `<div class="tl-detail">${esc(block.detail)}</div>` : ""}</span>
          </div>`).join("")}
        ${(schedule.notes || []).map((note) => `<div class="tl-note">${esc(note)}</div>`).join("")}
        ${(schedule.flags || []).map((flag) => `<div class="tl-flag">⚠ ${esc(flag)}</div>`).join("")}
        ${(schedule.alternatives || []).map((entry) => `<div class="tl-alt">
            ↪ <b>${esc(entry.sight)}</b> ${esc(entry.problem)} — ${esc(entry.suggestion)}
          </div>`).join("")}
      </details>`
    : "";

  const controls = `<div class="day-controls">
      <button class="mini" data-extend="${day.day}" data-hours="1.5">+1.5h on this day</button>
      ${(budget.extra_hours || 0) > 0
        ? `<button class="mini" data-extend="${day.day}" data-hours="0">reset +${hours(budget.extra_hours)}</button>` : ""}
      <button class="mini" data-start="${day.day}">start ${esc(schedule.starts || "09:00")}</button>
      <button class="mini" data-activity="${day.day}">+ your own activity</button>
    </div>`;

  return `<section class="day" data-day="${day.day}" data-city="${esc(day.city)}">
      <header>
        <div><h2>Day ${day.day} · ${esc(day.city)}</h2>${
          where ? `<div class="where">${where}</div>` : ""}</div>
        <div class="where">${hours(day.used_hours)} of ${hours(day.available_hours)} used${
          schedule.span_hours ? ` · on the go ${esc(schedule.starts)}–${esc(schedule.ends)} (${hours(schedule.span_hours)})` : ""}</div>
      </header>
      ${bar}
      ${controls}
      ${sights}
      ${timeline}
      ${day.notes && day.notes.length ? `<ul class="notes">${day.notes.map((n) => `<li>${esc(n)}</li>`).join("")}</ul>` : ""}
    </section>`;
}

function render(plan) {
  const summary = plan.summary;
  const nights = Object.entries(summary.nights_per_city).map(([city, n]) => `${esc(city)} ${n}N`).join(" · ");
  const stats = `<div class="stats">
      <div class="stat"><b>${summary.days}</b><span>days · ${summary.total_nights} nights</span></div>
      <div class="stat"><b>${summary.total_sights}</b><span>attractions</span></div>
      <div class="stat"><b>${hours(summary.total_sightseeing_hours)}</b><span>sightseeing</span></div>
      <div class="stat"><b>${hours(summary.total_local_travel_hours)}</b><span>local travel</span></div>
      <div class="stat"><b>${hours(summary.total_intercity_drive_hours)}</b><span>intercity travel</span></div>
    </div>`;

  const route = plan.route.length
    ? `<div class="route">${plan.route.map((leg) => `
        <div class="leg${leg.data_gap ? " gap" : ""}">
          <b>${esc(leg.from_city)} → ${esc(leg.to_city)}</b> ·
          ${leg.drive_hours !== null ? `${hours(leg.drive_hours)}${leg.road_km ? ` · ${leg.road_km} km` : ""} · ${esc(leg.mode)}` : "no journey time in the dataset"}
          ${leg.is_overnight ? " · overnight" : ""}
        </div>`).join("")}</div>`
    : "";

  const trip = tripPanel(plan);
  const tips = (plan.suggestions || {}).suggestions || [];
  const tipPanel = tips.length
    ? `<section class="day tips"><h2>Suggestions</h2>
        <div class="sub">Each one is a single change. Nothing is applied until you say so.</div>
        ${tips.map((tip, index) => `<div class="tip tip-${esc(tip.group)}">
            <div class="tip-what">${esc(tip.message)}</div>
            <div class="tip-fix">${esc(tip.fix)}</div>
            <button class="mini apply" data-tip="${index}">Apply</button>
          </div>`).join("")}
      </section>`
    : "";
  window._tips = tips;
  const slotted = Object.entries(plan.unplaceable_reasons || {});
  const slotNote = slotted.length
    ? `<section class="day missed"><h2>Kept for another trip</h2>
        <div class="sub">These need a time of day no day on this trip can give them. The engine leaves
        them out rather than showing them at the wrong hour.</div>
        <ul class="notes">${slotted.map(([label, reason]) =>
          `<li><b>${esc(label.split(" / ").slice(1).join(" / "))}</b> — ${esc(reason)}</li>`).join("")}</ul>
      </section>`
    : "";
  const missed = Object.keys(plan.unscheduled_reasons || {}).length
    ? `<div class="missed"><h3>Must-visit sights that did not fit</h3><ul>${
        Object.entries(plan.unscheduled_reasons).map(([label, reason]) =>
          `<li><b>${esc(prettyLabel(label))}</b> — ${esc(reason)}</li>`).join("")}</ul></div>`
    : "";

  const closed = (plan.closed_this_month || []).length
    ? `<div class="missed"><h3>Closed in the chosen month</h3><ul>${
        plan.closed_this_month.slice(0, 12).map((item) => `<li>${esc(item)}</li>`).join("")}</ul></div>`
    : "";

  lastPlan = plan;
  renderPrint(plan);

  const issues = tips.length + slotted.length
    + Object.keys(plan.unscheduled_reasons || {}).length;
  const tabs = [
    { id: "itinerary", label: "Itinerary" },
    { id: "customise", label: "Customise" },
    { id: "issues", label: "Suggestions", count: issues },
    { id: "add", label: "Add sights" },
  ];

  $("out").innerHTML = `
    <div class="trip-bar">
      <div>
        <h2>${esc(plan.request.cities.join(" + "))}</h2>
        <div class="where">${summary.days} days · ${nights} · ${esc(plan.request.pace)} pace${
          summary.departure_day_reserved_for ? ` · departure: ${esc(summary.departure_day_reserved_for)}` : ""}</div>
      </div>
      <div class="trip-bar-actions">
        <button class="mini" id="change-trip">Change trip</button>
        <button class="mini primary" id="print-2">Print for customer</button>
      </div>
    </div>
    ${validationBanner(plan.validation)}
    <nav class="tabs">${tabs.map((tab) => `
      <button class="tab" data-tab="${tab.id}">${esc(tab.label)}${
        tab.count ? `<span class="tab-count">${tab.count}</span>` : ""}</button>`).join("")}</nav>

    <div class="panel" data-panel="itinerary">
      ${stats}${route}
      ${plan.days.map((day) => dayCard(day, "view")).join("")}
    </div>

    <div class="panel" data-panel="customise">
      ${trip}
      <p class="panel-hint">Drag a stop onto another day to move it, or onto another stop to swap.
        Every change rebuilds the whole plan, so times and travel stay correct.</p>
      ${plan.days.map((day) => dayCard(day, "edit")).join("")}
      ${operationLog(plan)}${changeLog(plan)}
    </div>

    <div class="panel" data-panel="issues">
      ${tipPanel || '<p class="panel-hint">Nothing to flag — this plan passes every check.</p>'}
      ${slotNote}${missed}${closed}
    </div>

    <div class="panel" data-panel="add">${addPanel(plan) ||
      '<p class="panel-hint">Every sight in these cities is already in the plan.</p>'}</div>`;

  showTab(activeTab);
  window.scrollTo({ top: $("out").offsetTop - 20, behavior: "smooth" });
}

function closeForm() { document.querySelector("form.card").classList.add("tucked"); }

function openForm() {
  document.querySelector("form.card").classList.remove("tucked");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

// Which tab is open survives a rebuild: an agent who edits on the Customise tab should
// still be looking at it when the new plan arrives.
let activeTab = "itinerary";

function showTab(id) {
  const panels = [...document.querySelectorAll(".panel")];
  if (!panels.some((panel) => panel.dataset.panel === id)) id = "itinerary";
  activeTab = id;
  panels.forEach((panel) => panel.classList.toggle("on", panel.dataset.panel === id));
  document.querySelectorAll(".tab").forEach((tab) =>
    tab.classList.toggle("on", tab.dataset.tab === id));
}

// --- editing: add, replace or remove sights, then rebuild the whole plan ---------------
// Everything about the trip as a whole that can be changed without starting again.
function tripPanel(plan) {
  const split = plan.summary?.days_per_city || {};
  const cities = Object.keys(split);
  const pace = plan.request?.pace || "moderate";
  const total = Object.values(split).reduce((sum, days) => sum + days, 0);
  const rows = cities.map((city) => `
    <div class="alloc-row">
      <span class="alloc-city">${esc(city)}</span>
      <button class="mini" data-days="${esc(city)}" data-delta="-1"
        ${split[city] <= 1 ? "disabled" : ""} title="one day less here">&minus;</button>
      <b class="alloc-n">${split[city]}</b>
      <button class="mini" data-days="${esc(city)}" data-delta="1"
        ${cities.length < 2 ? "disabled" : ""} title="one day more here">+</button>
    </div>`).join("");

  return `<section class="day trip-panel">
      <h2>Customise this trip</h2>
      <div class="sub">Change it here and the whole plan is rebuilt around you — route, times and
        checks included. Nothing needs re-entering.</div>
      <div class="alloc">
        <div class="alloc-head">Days per city <span>${total} of ${total} allocated</span></div>
        ${rows}
        ${cities.length < 2 ? `<div class="alloc-note">Add a second city to split days between them.</div>` : ""}
      </div>
      <div class="alloc">
        <div class="alloc-head">Pace</div>
        <div class="pace-row">
          ${["relaxed", "moderate", "active"].map((name) =>
            `<button class="mini ${name === pace ? "on" : ""}" data-pace="${name}">${name}</button>`).join("")}
        </div>
      </div>
    </section>`;
}

function operationLog(plan) {
  const ops = plan.operations || [];
  if (!ops.length) return "";
  return `<div class="changes"><h3 style="margin:0 0 8px;font-size:15px">Your customisations</h3><ul>${
    ops.map((op) => `<li class="${op.applied ? "yes" : "no"}">${op.applied ? "✓" : "✕"} ${esc(op.message)}</li>`).join("")}</ul>
    <button class="mini" id="reset-custom" style="margin-top:6px">Undo customisations</button></div>`;
}

function changeLog(plan) {
  if (!plan.edits || !plan.edits.length) return "";
  return `<div class="changes"><h3 style="margin:0 0 8px;font-size:15px">Your changes</h3><ul>${
    plan.edits.map((e) => `<li class="${e.applied ? "yes" : "no"}">${e.applied ? "\u2713" : "\u2715"} ${esc(e.message)}${
      (e.suggestions || []).length
        ? `<div class="daypick">${e.suggestions.map((s) =>
            `<button data-try-day="${s.day}" data-try-sight="${esc(e.sight)}" data-try-replace="${esc(s.replace || "")}">${esc(s.detail)}</button>`
          ).join("")}</div>`
        : ""}</li>`).join("")}</ul>
    <button class="mini" id="reset-edits" style="margin-top:6px">Undo all changes</button></div>`;
}

function addPanel(plan) {
  const pool = plan.unscheduled_sights || [];
  if (!pool.length) return "";
  const reasons = plan.unscheduled_reasons || {};
  const ordered = pool.slice().sort((a, b) => (reasons[b] ? 1 : 0) - (reasons[a] ? 1 : 0));
  return `<div class="add-panel">
      <h3>Not in the plan &mdash; add any of these</h3>
      <div class="sub">Adding or replacing rebuilds the route, travel times and every day's schedule within the
        daily limit. If a sight cannot fit the day you choose, you will be offered the days it does fit.</div>
      ${ordered.slice(0, 15).map((label) => {
        const city = label.split(" / ")[0];
        const name = label.split(" / ").slice(1).join(" / ");
        const why = reasons[label];
        return `<div class="addable">
          <div class="grow">
            <div class="sight-name">${esc(name)} ${why ? `<span class="tag must">\u2605 must visit</span>` : ""}</div>
            <div class="why">${esc(city === name ? "in this city" : city)}${why ? ` &middot; ${esc(why)}` : ""}</div>
          </div>
          <button class="mini" data-add-sight="${esc(name)}" data-city="${esc(city)}">Add to Itinerary</button>
        </div>`;
      }).join("")}
    </div>`;
}

async function runEdits(newEdits) {
  if (!lastRequest) return;
  edits = edits.concat(newEdits);
  $("status").textContent = "Recalculating\u2026";
  $("go").disabled = true;
  try {
    const response = await fetch("/itinerary/adjust", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ base: lastRequest, edits }),
    });
    const payload = await response.json();
    if (!response.ok) { $("status").textContent = payload.detail || "Could not apply that change."; return; }
    render(payload);
  } finally {
    $("go").disabled = false; $("status").textContent = "";
  }
}

async function runOperations(operations) {
  if (!lastRequest || !operations.length) return;
  customisations = customisations.concat(operations);
  $("status").textContent = "Recalculating…";
  $("go").disabled = true;
  try {
    const response = await fetch("/itinerary/customize", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ base: lastRequest, operations: customisations }),
    });
    const payload = await response.json();
    if (!response.ok) {
      customisations = customisations.slice(0, -operations.length);
      $("status").textContent = payload.detail || "Could not apply that change.";
      return;
    }
    render(payload);
  } finally {
    $("go").disabled = false; $("status").textContent = "";
  }
}

async function offerDays(sight, city, host) {
  $("status").textContent = "Checking where it fits\u2026";
  const response = await fetch("/itinerary/placement-options", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ base: lastRequest, sight, city }),
  });
  $("status").textContent = "";
  if (!response.ok || !host) return;
  const data = await response.json();
  host.querySelector(".daypick")?.remove();
  const picker = document.createElement("div");
  picker.className = "daypick";
  picker.innerHTML = data.options.map((option) => {
    const common = `data-choose-sight="${esc(sight)}" data-choose-city="${esc(city)}" data-choose-day="${option.day}"`;
    if (option.fits) {
      return `<button class="fit" ${common}>Day ${option.day} \u00b7 ${option.spare_hours.toFixed(1)}h spare</button>`;
    }
    const swap = (option.replace_options || [])[0];
    if (swap) {
      return `<button class="swap" ${common} data-choose-replace="${esc(swap.sight)}">Day ${option.day} \u00b7 swap out ${esc(swap.sight)}</button>`;
    }
    if ((option.fits_if_dropped || []).length) {
      return `<button class="swap" ${common} data-choose-replace="${esc(option.fits_if_dropped[0])}">Day ${option.day} \u00b7 needs ${option.fits_if_dropped.length} stops dropped</button>`;
    }
    return `<button class="no" disabled title="${esc((option.blockers || []).join(" "))}">Day ${option.day} \u00b7 full</button>`;
  }).join("") +
  `<button data-choose-sight="${esc(sight)}" data-choose-city="${esc(city)}" data-choose-day="">Let the planner choose</button>`;
  // Nothing fits and nothing can be swapped out: say why, rather than showing dead buttons.
  const hopeless = data.options.every((o) => !o.fits && !(o.replace_options || []).length && !(o.fits_if_dropped || []).length);
  if (hopeless && data.options.length) {
    picker.insertAdjacentHTML("afterbegin",
      `<div class="why" style="flex-basis:100%">No day of this trip can hold ${esc(data.sight)}
       (${data.duration_hours.toFixed(1)}h plus travel). Try a faster pace or an extra day in ${esc(data.city)}.</div>`);
  }
  host.appendChild(picker);
}

document.addEventListener("click", (event) => {
  const tab = event.target.closest("[data-tab]");
  if (tab) { showTab(tab.dataset.tab); return; }
  if (event.target.closest("#change-trip")) { openForm(); return; }
  if (event.target.closest("#print-2")) { $("print").click(); return; }

  const take = event.target.closest("[data-take]");
  if (take) {
    // An optional activity the customer chooses becomes an ordinary stop: the day is
    // lengthened to hold it rather than the request being refused.
    runOperations([{ operation: "pin", sight: take.dataset.take,
                     city: take.dataset.city, day: Number(take.dataset.takeDay) }]);
    return;
  }

  const tip = event.target.closest("[data-tip]");
  const extend = event.target.closest("[data-extend]");
  const activity = event.target.closest("[data-activity]");
  const moveDay = event.target.closest("[data-days]");
  const paceBtn = event.target.closest("[data-pace]");
  const startBtn = event.target.closest("[data-start]");
  const exchange = event.target.closest("[data-exchange]");
  const pickExchange = event.target.closest("[data-exchange-with]");

  if (moveDay) {
    // One click always keeps the total: the day comes from (or goes to) the roomiest city.
    const split = { ...(lastPlan?.summary?.days_per_city || {}) };
    const city = moveDay.dataset.days;
    const delta = Number(moveDay.dataset.delta);
    const others = Object.keys(split).filter((name) => name !== city);
    const partner = delta > 0
      ? others.sort((a, b) => split[b] - split[a])[0]
      : others.sort((a, b) => split[a] - split[b])[0];
    if (!partner || (delta > 0 && split[partner] <= 1)) {
      $("status").textContent = "No other city has a day to spare.";
      return;
    }
    split[city] += delta;
    split[partner] -= delta;
    runOperations([{ operation: "reallocate", city_days: split }]);
    return;
  }
  if (paceBtn) { runOperations([{ operation: "set_pace", pace: paceBtn.dataset.pace }]); return; }
  if (startBtn) {
    const at = prompt("What time should this day start? e.g. 07:30", "08:00");
    if (at) runOperations([{ operation: "set_day_start", day: Number(startBtn.dataset.start), at }]);
    return;
  }
  if (exchange) {
    const host = exchange.closest("li");
    host.querySelectorAll(".exchange").forEach((node) => node.remove());
    const mine = exchange.dataset.exchange;
    const myDay = Number(exchange.dataset.day);
    // Swapping is between days; within a day it is a reorder, which dragging already does.
    const others = (lastPlan?.days || []).filter((day) => day.day !== myDay).flatMap((day) =>
      day.sights.filter((s) => s.sight !== mine && !s.en_route)
        .map((s) => ({ sight: s.sight, day: day.day })));
    if (!others.length) {
      $("status").textContent = "No stop on another day to swap with — drag to reorder within a day.";
      return;
    }
    const picker = document.createElement("div");
    picker.className = "exchange";
    picker.innerHTML = `<div class="alloc-nights">Swap '${esc(mine)}' with:</div>` +
      others.map((o) => `<button class="mini" data-exchange-with="${esc(o.sight)}"
        data-mine="${esc(mine)}" data-their-day="${o.day}">${esc(o.sight)} (day ${o.day})</button>`).join("");
    host.appendChild(picker);
    return;
  }
  if (pickExchange) {
    runOperations([{ operation: "swap", sight: pickExchange.dataset.mine,
                     with_sight: pickExchange.dataset.exchangeWith,
                     with_day: Number(pickExchange.dataset.theirDay) }]);
    return;
  }

  if (tip) {
    const chosen = (window._tips || [])[Number(tip.dataset.tip)];
    if (chosen) {
      const { endpoint, ...operation } = chosen.action;
      runOperations([operation]);
    }
    return;
  }
  if (extend) {
    runOperations([{ operation: "extend_day", day: Number(extend.dataset.extend),
                     hours: Number(extend.dataset.hours) }]);
    return;
  }
  if (activity) { openActivityPanel(Number(activity.dataset.activity), activity); return; }
  if (event.target.closest("[data-close-activity]")) { closeActivityPanel(); return; }
  if (event.target.closest("[data-suggested]")) { loadSuggested(); return; }
  const pick = event.target.closest("[data-pick-activity]");
  if (pick) {
    const node = pick.dataset;
    $("act-name").value = node.pickActivity;
    if (node.pickHours) $("act-hours").value = node.pickHours;
    if (node.pickAt) $("act-at").value = node.pickAt;
    // A sight from the dataset is a real stop, not a free-text note: add it as one.
    $("act-form").dataset.kind = node.pickKind || "activity";
    $("act-form").dataset.sight = node.pickKind === "sight" ? node.pickActivity : "";
    renderActivityMatches([]);
    return;
  }
  if (event.target.closest("[data-add-activity-go]")) { submitActivity(); return; }

  const addBtn = event.target.closest("[data-add-sight]");
  const choose = event.target.closest("[data-choose-sight]");
  const swap = event.target.closest("[data-swap]");
  const drop = event.target.closest("[data-drop]");
  const retry = event.target.closest("[data-try-sight]");
  const reset = event.target.closest("#reset-edits");
  const resetCustom = event.target.closest("#reset-custom");
  if (resetCustom) { customisations = []; runOperations([]); $("form").dispatchEvent(new Event("submit")); return; }

  if (addBtn) offerDays(addBtn.dataset.addSight, addBtn.dataset.city, addBtn.closest(".addable"));
  if (choose) {
    runEdits([{
      action: choose.dataset.chooseReplace ? "replace" : "add",
      sight: choose.dataset.chooseSight,
      city: choose.dataset.chooseCity,
      day: choose.dataset.chooseDay ? Number(choose.dataset.chooseDay) : null,
      replaces: choose.dataset.chooseReplace || null,
    }]);
  }
  if (retry) {
    runEdits([{
      action: retry.dataset.tryReplace ? "replace" : "add",
      sight: retry.dataset.trySight,
      city: null,
      day: retry.dataset.tryDay ? Number(retry.dataset.tryDay) : null,
      replaces: retry.dataset.tryReplace || null,
    }]);
  }
  if (drop) runEdits([{ action: "remove", sight: drop.dataset.drop, city: drop.dataset.city }]);
  if (swap) {
    const pool = (lastPlan?.unscheduled_sights || []).map((label) => label.split(" / ").slice(1).join(" / "));
    if (!pool.length) { $("status").textContent = "Every sight in this city is already scheduled."; return; }
    const choice = window.prompt(
      `Replace "${swap.dataset.swap}" on day ${swap.dataset.day} with which sight?\n\nAvailable:\n` + pool.slice(0, 15).join("\n"),
      pool[0]);
    if (choice) {
      runEdits([{ action: "replace", sight: choice.trim(), city: swap.dataset.city,
                  day: Number(swap.dataset.day), replaces: swap.dataset.swap }]);
    }
  }
  if (reset) { edits = []; $("form").dispatchEvent(new Event("submit")); }
});

loadCities();

// --- The printed itinerary ------------------------------------------------------------------
// Built from the plan, not from the page: the screen shows budgets, validation and controls
// that a traveller has no use for, and hiding them one by one leaves every future addition
// to leak into the print. Only what a customer needs is written here.
// The planner works to the minute; a customer document should not. Every instant rounds to
// the nearest five minutes the same way, so the end of one row is exactly the start of the
// next -- rounding starts down and ends up instead made consecutive rows overlap on paper,
// which reads as a mistake even though the underlying plan is sound.
function roundClock(text) {
  const [h, m] = String(text || "0:00").split(":").map(Number);
  const total = Math.min(Math.round((h * 60 + m) / 5) * 5, 23 * 60 + 55);
  return `${String(Math.floor(total / 60)).padStart(2, "0")}:${String(total % 60).padStart(2, "0")}`;
}

function printTime(block) {
  return `${roundClock(block.start)}\u2013${roundClock(block.end)}`;
}

function firstSentence(text, limit) {
  if (!text) return "";
  const stop = text.indexOf(". ");
  const out = stop > 30 ? text.slice(0, stop + 1) : text;
  return out.length > limit ? out.slice(0, limit - 1).trimEnd() + "\u2026" : out;
}

// What this itinerary does and does not cover, taken from the plan itself. The engine does
// not model hotels, meals or prices, so those are stated as not included rather than
// promised -- a printed promise the engine cannot keep is worse than a blank page.
function printTerms(plan) {
  const transfers = plan.days.filter((day) => day.transfer && day.transfer.drive_hours !== null);
  const enRoute = plan.days.some((day) => day.sights.some((s) => s.en_route));
  const own = plan.days.some((day) => (day.schedule?.blocks || []).some((b) => b.kind === "custom"));
  const included = [
    `Sightseeing on ${plan.days.filter((d) => d.sights.length).length} day(s) as listed, in the order shown`,
    "Travel time between sights within each city",
  ];
  if (transfers.length) {
    included.push(`${transfers.length} intercity transfer(s) by ${
      [...new Set(transfers.map((d) => d.transfer.mode || "road"))].join(" / ")}`);
  }
  if (enRoute) included.push("Stops made along the way during transfers");
  if (own) included.push("Your own planned activities, as marked");

  const excluded = [
    "Accommodation",
    "Meals, unless listed as an activity",
    "Entry tickets, guide fees and camera charges",
    "Flights and train tickets",
    "Personal expenses, tips and anything not listed above",
  ];
  return { included, excluded };
}

function renderPrint(plan) {
  const host = $("print-doc");
  if (!host || !plan) return;
  const cities = (plan.request?.cities || []).join(" \u00b7 ");
  const summary = plan.summary || {};
  const nights = Object.entries(summary.nights_per_city || {})
    .map(([city, n]) => `${city} ${n}N`).join(", ");

  const days = plan.days.map((day) => {
    const blocks = (day.schedule?.blocks || []).filter((b) =>
      ["sight", "transfer", "custom", "lunch", "check-in", "checkout"].includes(b.kind));
    const rows = blocks.map((block) => {
      const sight = day.sights.find((s) => s.sight === block.sight);
      const note = block.kind === "sight"
        ? firstSentence(sight?.description || "", 170)
        : (block.kind === "transfer" ? block.detail : "");
      return `<tr>
          <td class="pr-time">${esc(printTime(block))}</td>
          <td class="pr-what"><b>${esc(block.kind === "sight" ? block.sight : block.label)}</b>
            ${note ? `<span class="pr-note">${esc(note)}</span>` : ""}</td>
        </tr>`;
    }).join("");

    const transfer = day.transfer && day.transfer.drive_hours !== null
      ? `<div class="pr-transfer"><b>${esc(day.transfer.from_city)} \u2192 ${esc(day.transfer.to_city)}</b>
           \u00b7 ${esc(day.transfer.road_km ? Math.round(day.transfer.road_km) + " km" : "")}
           ${esc(hours(day.transfer.drive_hours))} by ${esc(day.transfer.mode || "road")}</div>`
      : "";

    return `<section class="pr-day">
        <div class="pr-day-head">
          <span class="pr-day-no">Day ${day.day}</span>
          <span class="pr-day-where">${esc(day.city)}${
            day.is_arrival_day ? " \u00b7 arrival" : day.is_departure_day ? " \u00b7 departure" : ""}</span>
        </div>
        ${transfer}
        ${rows ? `<table class="pr-items">${rows}</table>`
               : `<div class="pr-note" style="padding:4px 9px">A free day \u2014 nothing scheduled.</div>`}
      </section>`;
  }).join("");

  const terms = printTerms(plan);
  host.innerHTML = `
    <div class="pr-head">
      <div class="pr-title">${esc(cities)}</div>
      <div class="pr-sub">${summary.days} days${nights ? " \u00b7 " + esc(nights) : ""} \u00b7
        ${summary.total_sights} sightseeing stops</div>
    </div>
    ${days}
    <div class="pr-terms">
      <div class="pr-cols">
        <div><h3>Included</h3><ul>${terms.included.map((t) => `<li>${esc(t)}</li>`).join("")}</ul></div>
        <div><h3>Not included</h3><ul>${terms.excluded.map((t) => `<li>${esc(t)}</li>`).join("")}</ul></div>
      </div>
      <div class="pr-foot">Timings are planned estimates and may shift with traffic, opening hours and
        weather. Sights marked for a particular time of day are placed accordingly.</div>
    </div>`;
}

// --- who is travelling, and what they came for ------------------------------------------
// The vocabulary comes from the server so the page cannot offer an interest the planner
// does not understand.
let chosenInterests = [];

function renderInterests(options) {
  const host = $("interests");
  if (!host || !options?.interests) return;
  host.innerHTML = options.interests.map((item) =>
    `<button type="button" class="chip" data-interest="${esc(item.interest)}"
       aria-pressed="false" title="${esc(item.dataset_categories.join(", "))}">${esc(item.interest)}</button>`
  ).join("");
}

document.addEventListener("click", (event) => {
  const chip = event.target.closest("[data-interest]");
  if (!chip) return;
  const name = chip.dataset.interest;
  const on = chosenInterests.includes(name);
  chosenInterests = on ? chosenInterests.filter((x) => x !== name) : [...chosenInterests, name];
  chip.setAttribute("aria-pressed", String(!on));
});

// --- Adding something to a day ------------------------------------------------------------
// The dataset is the authority on what exists, so the box searches it rather than taking a
// free-text name on trust: a sight picked from the list is added as a real stop, and only
// something that matches nothing becomes a note on the day.
let activityDay = null;
let searchTimer = null;

function closeActivityPanel() {
  document.querySelectorAll(".activity-panel").forEach((node) => node.remove());
  activityDay = null;
}

function openActivityPanel(day, host) {
  closeActivityPanel();
  activityDay = day;
  const panel = document.createElement("div");
  panel.className = "activity-panel";
  panel.innerHTML = `
    <form id="act-form" data-kind="activity" onsubmit="return false">
      <div class="act-row">
        <input id="act-name" type="text" autocomplete="off" placeholder="Search sights, or type your own…">
        <button class="mini" data-suggested="1" type="button">Suggested</button>
        <button class="mini" data-close-activity="1" type="button" title="close">&times;</button>
      </div>
      <div id="act-matches" class="act-matches"></div>
      <div class="act-row">
        <label>at <input id="act-at" type="text" placeholder="20:00" size="6"></label>
        <label>for <input id="act-hours" type="number" step="0.5" min="0.5" max="12" value="1.5">h</label>
        <button class="mini" data-add-activity-go="1" type="button">Add to day ${day}</button>
      </div>
    </form>`;
  host.closest(".day-controls").appendChild(panel);
  const box = $("act-name");
  box.focus();
  box.addEventListener("input", () => {
    clearTimeout(searchTimer);
    $("act-form").dataset.kind = "activity";
    searchTimer = setTimeout(() => searchActivities(box.value), 160);
  });
}

async function searchActivities(text) {
  if (!text || text.trim().length < 2) { renderActivityMatches([]); return; }
  const response = await fetch("/itinerary/activity-search", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text, base: lastRequest, limit: 8 }),
  });
  if (!response.ok) return;
  renderActivityMatches((await response.json()).matches || []);
}

async function loadSuggested() {
  const response = await fetch("/itinerary/activity-suggestions", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ base: lastRequest, day: activityDay, limit: 10 }),
  });
  if (!response.ok) return;
  const data = await response.json();
  renderActivityMatches([...(data.sights || []), ...(data.activities || [])], true);
}

function renderActivityMatches(matches, suggested) {
  const host = $("act-matches");
  if (!host) return;
  if (!matches.length) { host.innerHTML = ""; return; }
  host.innerHTML = matches.map((m) => {
    const why = m.kind === "sight"
      ? [m.city, m.best_time, m.duration_hours ? `${m.duration_hours}h` : "",
         m.must_visit ? "★ must visit" : "",
         m.scheduled_on ? `already on day ${m.scheduled_on}` : ""].filter(Boolean).join(" · ")
      : "your own plan";
    const how = (suggested || !m.how || m.how === "suggested" || m.how === "exact")
      ? "" : `<span class="act-how">${esc(m.how)}</span>`;
    return `<button class="act-match" type="button" data-pick-activity="${esc(m.name)}"
        data-pick-kind="${esc(m.kind)}" data-pick-hours="${m.duration_hours || ""}"
        data-pick-at="${esc(m.at || "")}">
        <b>${esc(m.name)}</b>${how}<span class="act-why">${esc(why)}</span>
        ${m.detail ? `<span class="act-why">${esc(m.detail)}</span>` : ""}
      </button>`;
  }).join("");
}

function submitActivity() {
  const name = $("act-name").value.trim();
  if (!name) { $("status").textContent = "Give it a name first."; return; }
  const at = $("act-at").value.trim() || null;
  const hours = Number($("act-hours").value) || 1.5;
  const day = activityDay;
  const isSight = $("act-form").dataset.kind === "sight" && $("act-form").dataset.sight === name;
  closeActivityPanel();
  runOperations([isSight
    ? { operation: "pin", sight: name, day }
    : { operation: "add_activity", day, name, at, duration_hours: hours }]);
}

// --- Drag and drop -------------------------------------------------------------------------
// Dropping on a day moves the stop there; dropping on another stop swaps the two. Both go
// through /itinerary/customize, so the plan is rebuilt rather than patched in the browser.
let dragging = null;

document.addEventListener("dragstart", (event) => {
  const row = event.target.closest("li[data-sight]");
  if (!row) return;
  dragging = { sight: row.dataset.sight, day: Number(row.dataset.fromDay) };
  row.classList.add("dragging");
  event.dataTransfer.effectAllowed = "move";
  try { event.dataTransfer.setData("text/plain", row.dataset.sight); } catch (_) {}
});

document.addEventListener("dragend", () => {
  document.querySelectorAll(".dragging, .drop-target").forEach((node) =>
    node.classList.remove("dragging", "drop-target"));
  dragging = null;
});

document.addEventListener("dragover", (event) => {
  if (!dragging) return;
  const row = event.target.closest("li[data-sight]");
  const section = event.target.closest("section.day[data-day]");
  if (!row && !section) return;
  event.preventDefault();
  event.dataTransfer.dropEffect = "move";
  document.querySelectorAll(".drop-target").forEach((node) => node.classList.remove("drop-target"));
  (row || section).classList.add("drop-target");
});

document.addEventListener("drop", (event) => {
  if (!dragging) return;
  const row = event.target.closest("li[data-sight]");
  const section = event.target.closest("section.day[data-day]");
  event.preventDefault();
  const source = dragging;
  dragging = null;
  document.querySelectorAll(".dragging, .drop-target").forEach((node) =>
    node.classList.remove("dragging", "drop-target"));

  if (row && row.dataset.sight !== source.sight) {
    const targetDay = Number(row.dataset.fromDay);
    if (targetDay === source.day) {
      // Same day: a reorder. Send the order the list now implies.
      const order = [...row.closest("ol").querySelectorAll("li[data-sight]")]
        .map((node) => node.dataset.sight)
        .filter((name) => name !== source.sight);
      const at = order.indexOf(row.dataset.sight);
      order.splice(at, 0, source.sight);
      runOperations([{ operation: "reorder", day: targetDay, order }]);
    } else {
      runOperations([{ operation: "swap", sight: source.sight, day: source.day,
                       with_sight: row.dataset.sight, with_day: targetDay }]);
    }
    return;
  }
  if (section) {
    const targetDay = Number(section.dataset.day);
    if (targetDay !== source.day) {
      runOperations([{ operation: "move", sight: source.sight, from_day: source.day, to_day: targetDay }]);
    }
  }
});
</script>
</body>
</html>
